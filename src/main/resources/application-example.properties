spring.application.name=calisthenics

spring.datasource.url=jdbc:mysql://localhost:3306/<nombre_base_de_datos>
spring.datasource.username=<usuario_bd>
spring.datasource.password=<password_bd>

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Clave JWT: mínimo 32 bytes. Se lee de la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET}
# Opcional: duración del token en milisegundos (por defecto 1 hora)
jwt.expiration-ms=3600000

# Seed de usuarios iniciales (ADMIN, COACH, CLIENT). Desactivado por defecto.
# Para activarlo defina APP_SEED_ENABLED=true y todas las variables obligatorias
# (USERNAME, EMAIL, PASSWORD y NAME de cada rol). LAST_NAME y PHONE son opcionales.
# Es idempotente: no duplica usuarios existentes. Nunca ponga valores reales aqui.
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.admin.username=${APP_SEED_ADMIN_USERNAME:}
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:}
app.seed.admin.name=${APP_SEED_ADMIN_NAME:}
app.seed.admin.last-name=${APP_SEED_ADMIN_LAST_NAME:}
app.seed.admin.phone=${APP_SEED_ADMIN_PHONE:}
app.seed.coach.username=${APP_SEED_COACH_USERNAME:}
app.seed.coach.email=${APP_SEED_COACH_EMAIL:}
app.seed.coach.password=${APP_SEED_COACH_PASSWORD:}
app.seed.coach.name=${APP_SEED_COACH_NAME:}
app.seed.coach.last-name=${APP_SEED_COACH_LAST_NAME:}
app.seed.coach.phone=${APP_SEED_COACH_PHONE:}
app.seed.client.username=${APP_SEED_CLIENT_USERNAME:}
app.seed.client.email=${APP_SEED_CLIENT_EMAIL:}
app.seed.client.password=${APP_SEED_CLIENT_PASSWORD:}
app.seed.client.name=${APP_SEED_CLIENT_NAME:}
app.seed.client.last-name=${APP_SEED_CLIENT_LAST_NAME:}
app.seed.client.phone=${APP_SEED_CLIENT_PHONE:}

# CORS: orígenes permitidos separados por coma (por defecto el front en Vite)
cors.allowed-origins=http://localhost:5173
